<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="markOrbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703"/>
      <stop offset="40%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#E63946"/>
    </linearGradient>
    <linearGradient id="markHat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F3F5"/>
    </linearGradient>
    <linearGradient id="markCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDE59"/>
      <stop offset="100%" stop-color="#FF9100"/>
    </linearGradient>
    <filter id="markShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="#FDFBF7" stroke="#1A1A1A" stroke-width="3" filter="url(#markShadow)"/>

  <!-- Orbiting Cosmic Food Ring -->
  <path d="M 16 68 C 10 32 46 14 84 22 C 108 28 114 56 98 84 C 84 104 36 108 18 82" 
        stroke="url(#markOrbit)" stroke-width="5" stroke-linecap="round" fill="none"/>
  
  <!-- Orbiting Mini Spice Stars/Dots -->
  <circle cx="94" cy="24" r="4.5" fill="#E63946"/>
  <circle cx="16" cy="74" r="3.5" fill="#FFB703"/>
  <circle cx="102" cy="76" r="3" fill="#FF5722"/>

  <!-- Character / Mascot Head -->
  <g transform="translate(24, 18)">
    <!-- Hair & Head Base -->
    <path d="M 16 46 C 14 36 24 30 36 30 C 48 30 58 36 56 46 C 56 58 48 68 36 68 C 24 68 16 58 16 46 Z" fill="#1A1A1A"/>
    <!-- Face -->
    <ellipse cx="36" cy="50" rx="16" ry="14" fill="#FFDFBA"/>
    
    <!-- Chef Hat Base Shadow -->
    <path d="M 12 32 C 4 32 0 22 5 14 C 2 7 11 0 23 2 C 29 -3 43 -3 48 4 C 55 1 64 8 61 16 C 67 22 61 32 53 32 Z" fill="#1A1A1A"/>
    <!-- White Puffy Chef Hat -->
    <path d="M 14 30 C 7 30 3 21 8 14 C 5 7 14 1 24 3 C 30 -2 42 -2 46 5 C 53 2 61 9 58 16 C 64 22 58 30 51 30 Z" 
          fill="url(#markHat)" stroke="#FFFFFF" stroke-width="1.5"/>
    
    <!-- Hat Red Band -->
    <rect x="18" y="27" width="36" height="7" rx="2" fill="#E63946"/>
    <!-- Gold Crown -->
    <polygon points="32,32 34,28 36,32 38,28 40,32" fill="url(#goldCrown)"/>

    <!-- Black Sunglasses -->
    <rect x="22" y="44" width="12" height="9" rx="3" fill="#1A1A1A"/>
    <rect x="38" y="44" width="12" height="9" rx="3" fill="#1A1A1A"/>
    <rect x="33" y="46" width="6" height="2.5" fill="#1A1A1A"/>
    <!-- White Glint on Glasses -->
    <path d="M 24 46 L 27 50" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 40 46 L 43 50" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Cheerful Tongue & Smile -->
    <path d="M 30 58 Q 36 65 42 58 Z" fill="#E63946"/>
    <path d="M 32 60 Q 36 63 40 60" fill="#FF7A85"/>

    <!-- Hoodie Collar -->
    <path d="M 22 66 L 36 74 L 50 66" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 31 70 L 31 77" stroke="#FF5722" stroke-width="2" stroke-linecap="round"/>
    <path d="M 41 70 L 41 77" stroke="#FF5722" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
