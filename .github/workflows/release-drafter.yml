name: Release Drafter & Contributor Notes

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  draft-or-publish-release:
    name: Draft or Publish Release Notes
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Drafter
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          # Automatically publish the release if triggered by a version tag (e.g. v1.0.0);
          # otherwise, keep the draft release continuously updated as PRs merge to main.
          publish: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
