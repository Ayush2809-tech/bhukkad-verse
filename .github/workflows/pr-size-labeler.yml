name: PR Size Labeler

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  pull-requests: write

jobs:
  size-label:
    name: Estimate PR Size
    runs-on: ubuntu-latest
    steps:
      - name: Calculate PR diff size and label
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions;
            const deletions = pr.deletions;
            const totalChanges = additions + deletions;

            const sizeLabels = ['size/XS', 'size/S', 'size/M', 'size/L', 'size/XL'];
            let targetLabel = 'size/M';

            if (totalChanges < 20) {
              targetLabel = 'size/XS';
            } else if (totalChanges < 100) {
              targetLabel = 'size/S';
            } else if (totalChanges < 500) {
              targetLabel = 'size/M';
            } else if (totalChanges < 1000) {
              targetLabel = 'size/L';
            } else {
              targetLabel = 'size/XL';
            }

            // Remove existing size labels if any
            const existingLabels = pr.labels.map(l => l.name);
            for (const label of sizeLabels) {
              if (existingLabels.includes(label) && label !== targetLabel) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    name: label
                  });
                } catch (e) {
                  console.log(`Failed removing old size label ${label}:`, e.message);
                }
              }
            }

            // Add target size label
            if (!existingLabels.includes(targetLabel)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [targetLabel]
              });
            }
