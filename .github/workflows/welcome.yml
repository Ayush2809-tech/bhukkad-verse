name: Welcome First-Time Contributors

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  welcome:
    name: Welcome Contributor
    runs-on: ubuntu-latest
    steps:
      - name: Welcome new PR or Issue
        uses: actions/github-script@v7
        with:
          script: |
            const isPR = !!context.payload.pull_request;
            const item = isPR ? context.payload.pull_request : context.payload.issue;
            const author = item.user.login;

            // Check if author is a first-time contributor
            const authorAssociation = item.author_association;
            const isFirstTimer = authorAssociation === 'FIRST_TIME_CONTRIBUTOR' || authorAssociation === 'NONE';

            if (isFirstTimer) {
              const greetingMessage = isPR
                ? `👋 Hi @${author}! Thank you for submitting your first pull request to **Bhukkad Verse**! 🎉\n\nOur team and maintainers will review your changes shortly. In the meantime, please ensure:\n- Your PR conforms to our [Contributing Guidelines](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md).\n- All automated CI checks pass.\n- Your commit messages adhere to Conventional Commits.`
                : `👋 Hi @${author}! Thank you for creating your first issue in **Bhukkad Verse**! 🍲\n\nPlease make sure you've included all relevant details (logs, environment, steps to reproduce) so we can look into it promptly.`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.number,
                body: greetingMessage
              });
            }
