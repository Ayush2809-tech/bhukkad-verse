name: 🐛 Bug Report
description: File a bug report to help us fix an issue in Bhukkad Verse
title: "fix: "
labels: ["type: bug", "triage-needed"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much context as possible.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the platform is having issues?
      options:
        - Frontend Storefront (/ /shops /cart)
        - Vendor Dashboard (/vendor/dashboard)
        - Backend API / Authentication
        - Orders & Commission Split Engine
        - Geolocation & Maps / Serviceability
        - Documentation or CI/Tooling
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem clearly...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Details about your environment.
      placeholder: |
        - OS: [e.g. Windows 11, macOS Sequoia, Ubuntu 24.04]
        - Browser: [e.g. Chrome 125, Firefox, Safari]
        - Node Version: [e.g. 20.x]
        - Python Version: [e.g. 3.11]
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste any terminal stack traces or browser console logs here.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation
      options:
        - label: I have verified this is not a duplicate of an existing issue.
          required: true
        - label: I have checked that this issue does not contain sensitive credentials or tokens.
          required: true
