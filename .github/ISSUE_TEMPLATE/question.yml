name: ❓ Question / Support
description: Ask a question about Bhukkad Verse setup, architecture, or features
title: "question: "
labels: ["type: question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question or need guidance? We're here to help!
  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know or understand better?
      placeholder: Ask your question with relevant context...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What have you tried so far, or what parts of the docs did you check?
      placeholder: Share what you've tried or researched already...
