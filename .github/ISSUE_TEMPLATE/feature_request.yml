name: ✨ Feature Request
description: Propose a new feature, idea, or enhancement for Bhukkad Verse
title: "feat: "
labels: ["type: feature", "triage-needed"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide as much detail as possible to help us evaluate and prioritize it.
  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What category does this enhancement belong to?
      options:
        - Customer Experience (Discovery, Cart, 3D Showcase, Reels)
        - Vendor Management (Menu Builder, Dashboard, Analytics, Media)
        - Logistics & Operations (Delivery, Serviceability, Split Calculations)
        - Backend & Architecture (APIs, Database, Performance, Auth)
        - Developer Experience (CI/CD, Testing, Tooling, Docs)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: A clear and concise description of what the problem or opportunity is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Ideal Experience
      description: Describe what you would like to see happen.
      placeholder: Describe the proposed design, API, or user workflow.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: Any alternative approaches or existing solutions you evaluated.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be interested in submitting a Pull Request for this feature!
