version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: bhukkadverse_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bhukkadverse_db
      POSTGRES_USER: bhukkad_user
      POSTGRES_PASSWORD: bhukkad_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bhukkadverse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhukkadverse_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=bhukkadverse-dev-insecure-key-928374928374928374
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,0.0.0.0
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=bhukkadverse_db
      - DB_USER=bhukkad_user
      - DB_PASSWORD=bhukkad_dev_password
      - DB_HOST=db
      - DB_PORT=5432
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bhukkadverse_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
